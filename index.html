.dot{width:9px;height:9px;border-radius:2px;display:inline-block}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}
.panel h2{font-size:15px;margin:0 0 10px}
.chartbox{overflow-x:auto}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-bottom:6px}

.empty{padding:28px;text-align:center;color:var(--muted)}
[hidden]{display:none!important}

  $('kpis').innerHTML='<div class="kpi"><div class="l">Total</div><div class="v">'+nf.format(all)+'</div><div class="s">true '+nf.format(allT)+' · false '+nf.format(all-allT)+'</div></div>'+
    vis.map(i=>'<div class="kpi"><div class="l"><i class="dot" style="background:'+COL[i]+'"></i>'+DEVS[i]+'</div><div class="v">'+nf.format(tot[i])+'</div><div class="s">true '+nf.format(tr[i])+' · false '+nf.format(tot[i]-tr[i])+'</div></div>').join('');
  $('legend').innerHTML=vis.map(i=>'<span><i class="dot" style="background:'+COL[i]+'"></i>'+DEVS[i]+'</span>').join('');
  const a=$('f1').value||minD,b=$('f2').value||maxD;
  const ds=a<=b?days(a,b):[];
  const m={};ds.forEach(x=>m[x]=[0,0,0,0]);
  rows.forEach(r=>{if(m[r[0]])m[r[0]][r[1]]++});
  chart(ds,m,vis);
  // tabla resumen
  let h='<table><thead><tr><th>Fecha</th>'+vis.map(i=>'<th>'+DEVS[i]+'</th>').join('')+(vis.length>1?'<th>Total</th>':'')+'</tr></thead><tbody>';
  ds.slice().reverse().forEach(x=>{const v=m[x],t=vis.reduce((s,i)=>s+v[i],0);
    h+='<tr><td>'+fmtD(x)+'</td>'+vis.map(i=>'<td class="'+(v[i]?'':'z')+'">'+v[i]+'</td>').join('')+(vis.length>1?'<td><b>'+t+'</b></td>':'')+'</tr>'});
  h+='</tbody><tfoot><tr><td>Total</td>'+vis.map(i=>'<td>'+nf.format(tot[i])+'</td>').join('')+(vis.length>1?'<td>'+nf.format(all)+'</td>':'')+'</tr></tfoot></table>';
  $('sum').innerHTML=ds.length?h:'<div class="empty">La fecha inicial es posterior a la final.</div>';
  detail(rows);
  $('foot').textContent='Datos de la hoja “Datos Whatsapp”, del '+fmtD(minD)+' al '+fmtD(maxD)+'. El indicador true/false es la columna es_de_anuncio.';
}
function chart(ds,m,vis){
  const n=ds.length;if(!n){$('chart').innerHTML='';return}
  const W=Math.max(640,n*26+60),H=240,L=34,T=10,B=34,pw=W-L-8,ph=H-T-B;
  const mx=Math.max(1,...ds.map(x=>vis.reduce((s,i)=>s+m[x][i],0)));
  const step=[1,2,5,10,20,25,50,100,200].find(s=>mx/s<=5)||250,top=Math.ceil(mx/step)*step;
  const y=v=>T+ph-v/top*ph,bw=pw/n;
  let s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Leads por día">';
  for(let v=0;v<=top;v+=step){s+='<line x1="'+L+'" x2="'+(W-8)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+v+'</text>'}
  const every=Math.ceil(n/Math.floor(pw/54));
  ds.forEach((x,k)=>{let acc=0;const bx=L+k*bw+bw*.14,w=bw*.72;
    vis.forEach(i=>{const v=m[x][i];if(!v)return;s+='<rect x="'+bx+'" y="'+y(acc+v)+'" width="'+w+'" height="'+(y(acc)-y(acc+v))+'" fill="'+COL[i]+'"><title>'+fmtD(x)+' · '+DEVS[i]+': '+v+'</title></rect>';acc+=v});
    if(k%every===0)s+='<text x="'+(bx+w/2)+'" y="'+(H-14)+'" text-anchor="middle">'+x.slice(8)+' '+MES[+x.slice(5,7)-1]+'</text>'});
  $('chart').innerHTML=s+'</svg>';
}

}

function buildRows(b64){
  const bin=atob(b64),u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  const wb=XLSX.read(u,{type:'array',sheets:['Datos Whatsapp','Cat_Desarrollos']});
  const grid=n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null});
  const cat={};grid('Cat_Desarrollos').slice(1).forEach(r=>{if(r[0])cat[String(r[0]).trim()]=String(r[1]||'').trim()});
  const dayOf=q=>{
    if(typeof q==='number')return new Date(Math.round((q-25569)*864e5)).toISOString().slice(0,10);
    if(q instanceof Date)return q.toISOString().slice(0,10);
    const s=String(q||'').trim();let m;
    if(m=s.match(/^(\d{4})-(\d{2})-(\d{2})/))return m[1]+'-'+m[2]+'-'+m[3];
    if(m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
    return null};
  const str=v=>v==null?'':(typeof v==='number'?String(Math.round(v)):String(v)).trim();
  const recs=[];
  grid('Datos Whatsapp').slice(1).forEach(r=>{
    if(r[12]!=='lead_nuevo')return;
    const day=dayOf(r[16]);if(!day)return;
    const dev=DEVS.indexOf(cat[str(r[10])]);if(dev<0)return;
    const flag=(r[5]===true||String(r[5]).toUpperCase()==='TRUE')?1:0;
    recs.push({f:str(r[2]),day,dev,flag,n:str(r[0]),t:str(r[1])});
  });
  recs.sort((a,b)=>a.f<b.f?-1:a.f>b.f?1:0);
  const sn=DEVS.map(()=>new Set()),st=DEVS.map(()=>new Set()),out=[];let drop=0;
  recs.forEach(x=>{const nk=x.n.toLowerCase();
    if((x.t&&st[x.dev].has(x.t))||(nk&&sn[x.dev].has(nk))){drop++;return}
    if(x.t)st[x.dev].add(x.t);if(nk)sn[x.dev].add(nk);
    out.push([x.day,x.dev,x.flag,x.n,x.t,x.f.slice(11,16)])});
  out.sort((a,b)=>a[0]!==b[0]?(a[0]<b[0]?1:-1):(a[5]<b[5]?1:a[5]>b[5]?-1:0));
  return {rows:out,drop};
}

function onLive(ev){
  if(ev.type==='error'){
    const c=ev.error&&ev.error.code;
    const m={not_in_manifest:'Falta permitir Google Drive para este reporte.',consent_required:'Falta permitir Google Drive para este reporte.',needs_reauth:'Reconecta Google Drive en Ajustes > Conectores.',server_not_connected:'Agrega Google Drive en Ajustes > Conectores.',selection_required:'Elige qué cuenta de Google Drive usar.',blocked_by_policy:'Tu organización bloquea esta conexión.',tool_error:'Drive no pudo entregar la hoja.'}[c]||'No se pudo leer la hoja ahora.';
    setLive(false,m+' '+SNAPNOTE);return;
  }
  try{
    const res=ev.result;let p=res.payload;
    if(typeof p==='string'){try{p=JSON.parse(p)}catch(_){}}
    if(!p||typeof p.content!=='string'){const t=res.content&&res.content[0]&&res.content[0].text;if(t){try{p=JSON.parse(t)}catch(_){}}}
    if(!p||typeof p.content!=='string')throw new Error('formato');
    const out=buildRows(p.content);
    if(!out.rows.length)throw new Error('vacío');
    R=out.rows;setRange(false);render();
    const at=res.cache&&res.cache.storedAt?res.cache.storedAt:Date.now();
    setLive(true,'En vivo desde Google Sheets · actualizado a las '+hhmm(at)+' · se refresca cada minuto');
  }catch(e){setLive(false,'No pude interpretar la hoja ('+(e.message||'error')+'). '+SNAPNOTE)}
}
